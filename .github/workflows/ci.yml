# Integración continua: cada push o pull request valida el código antes de que llegue a entrenamiento (P1).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Estilo de código (ruff)
        run: ruff check src tests
      - name: Pruebas unitarias y de contrato con cobertura mínima del 80 %
        run: pytest -q --cov=src/aptos --cov-report=term-missing --cov-fail-under=80
