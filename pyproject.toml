[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptos"
version = "0.1.0"
description = "Clasificación de la severidad de la retinopatía diabética (APTOS 2019) con enfoque MLOps"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E702"]

[tool.coverage.run]
# El código de entrenamiento requiere GPU y se valida en el pipeline de CT; la puerta de cobertura
# aplica a los módulos compartidos entre entrenamiento e inferencia (criterio RNF-04 del diseño).
omit = ["src/aptos/entrenar.py", "src/aptos/modelo.py"]
